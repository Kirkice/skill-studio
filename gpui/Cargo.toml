[package]
name = "skill-studio-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = "=0.7.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
tempfile = "3"
notify = "7"
async-channel = "2"
serde_json = "1"
dirs = "6"
sha2 = "0.10"
