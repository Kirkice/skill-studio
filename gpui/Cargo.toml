[package]
name = "skill-studio-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
raw-window-handle = "=0.6.2"

[build-dependencies]
embed-resource = "=3.0.12"

[dependencies]
ttf-parser = "=0.25.1"
portable-pty = { version = "0.9", path = "vendor/portable-pty" }
vt100 = "0.16"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-base = "=0.7.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
tempfile = "3"
notify = "7"
async-channel = "2"
serde_json = "1"
dirs = "6"
sha2 = "0.10"
ropey = "=2.0.0-beta.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
